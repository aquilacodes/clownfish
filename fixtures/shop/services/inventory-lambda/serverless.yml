service: inventory-lambda
provider:
  name: aws
  runtime: nodejs20.x
  environment:
    STOCK_TABLE: ${self:service}-stock
functions:
  reserve:
    handler: src/handler.reserve
    events:
      - sqs:
          arn: !GetAtt InventoryQueue.Arn
  getStock:
    handler: src/handler.getStock
    events:
      - httpApi: GET /stock/{sku}
  onOrderEvent:
    handler: src/handler.onOrderEvent
    events:
      - sns: order-events
resources:
  Resources:
    InventoryQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: inventory-reservations
